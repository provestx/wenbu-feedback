<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24533F">
<title>稳步 · 用户反馈</title>
<meta name="description" content="「稳步」智能鞋垫用户反馈：体验会现场与日常使用两阶段，老人版与子女版分卷。">
<style>
/* 布局：手机竖屏单栏，一屏一题；顶部品牌条 + 脚印进度，底部固定操作区 */
:root{
  --bg:#F2F5F1;          /* 浅苔灰，纸面 */
  --surface:#FFFFFF;
  --ink:#16241D;         /* 墨绿黑 */
  --muted:#5B6B62;
  --line:#D4DDD6;
  --accent:#24533F;      /* 松绿，品牌主色 */
  --accent-ink:#FFFFFF;
  --accent-soft:#E1ECE5;
  --amber:#D9902B;       /* 晨光琥珀，用于高亮与脚印 */
  --amber-soft:#FBEFD9;
  --good:#2F7D55; --warn:#B9771C; --bad:#B4432F;
  --good-soft:#E2F1E8; --warn-soft:#FAEED8; --bad-soft:#F7E2DD;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101813; --surface:#18221C; --ink:#E8EFEA; --muted:#9CAEA3; --line:#2C3A31;
    --accent:#7FC3A0; --accent-ink:#0E1A13; --accent-soft:#1F3328;
    --amber:#E9A94B; --amber-soft:#3A2E1B;
    --good:#76C79A; --warn:#E3AE57; --bad:#E68673;
    --good-soft:#1C3326; --warn-soft:#3A2E19; --bad-soft:#3D221D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101813; --surface:#18221C; --ink:#E8EFEA; --muted:#9CAEA3; --line:#2C3A31;
  --accent:#7FC3A0; --accent-ink:#0E1A13; --accent-soft:#1F3328;
  --amber:#E9A94B; --amber-soft:#3A2E1B;
  --good:#76C79A; --warn:#E3AE57; --bad:#E68673;
  --good-soft:#1C3326; --warn-soft:#3A2E19; --bad-soft:#3D221D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.big{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--serif);font-size:1.25rem;letter-spacing:.08em}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.tool{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:6px 12px;font-size:.88rem;min-height:40px}
.tool svg{width:18px;height:18px}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 脚印进度 */
.steps{display:flex;align-items:flex-end;gap:4px;padding-block:10px 4px;overflow:hidden}
.steps svg{width:14px;height:22px;flex:none;color:var(--line);transition:color .3s}
.steps svg:nth-child(odd){transform:translateY(-5px) scaleX(-1)}
.steps svg.on{color:var(--amber)}
.steps svg.cur{color:var(--accent)}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* 视图 */
.view{padding-block:22px 140px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;color:var(--accent);font-weight:600}

/* 首页 */
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:1.85rem;line-height:1.3;margin-top:4px}
.hero p{color:var(--muted);margin:10px 0 0}
.insoles{width:78px;flex:none}
@media (max-width:360px){.hero h1{font-size:1.6rem}}
.pick{margin-top:26px;display:grid;gap:12px}
.pick h2{font-size:1.1rem;margin-top:8px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--radius);padding:16px;min-height:76px}
.choice .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.choice .ic svg{width:26px;height:26px}
.choice strong{display:block;font-size:1.12rem}
.choice span{display:block;color:var(--muted);font-size:.88rem}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg .choice{flex-direction:column;align-items:flex-start;gap:4px;min-height:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:20px;color:var(--muted);font-size:.85rem}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px;color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.links a{color:var(--accent);font-size:.9rem;text-underline-offset:3px}

/* 题卡 */
.q-title{font-size:1.55rem;line-height:1.35;margin-top:8px}
.q-sub{color:var(--muted);margin:8px 0 0;font-size:.95rem}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;padding:12px 16px;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);font-size:1.08rem}
.opt .box{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.opt.multi .box{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.opt[disabled]{opacity:.45}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:24px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border:2px solid transparent;border-radius:var(--radius);
  background:var(--surface);color:var(--muted);font-size:.8rem;line-height:1.3;min-height:96px}
.face svg{width:44px;height:44px}
.face[aria-checked="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.nps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:24px}
.nps button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;font-variant-numeric:tabular-nums}
.nps button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:24px}
.scale button{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.25rem;font-variant-numeric:tabular-nums}
.scale button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea,input[type=tel],input[type=text]{width:100%;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;font-size:1.05rem}
textarea{min-height:140px;resize:vertical;margin-top:22px}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-size:.95rem;font-weight:600}
.err{color:var(--bad);font-size:.88rem;min-height:1.4em}
.privacy{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:.85rem;color:var(--muted)}

/* 底部操作 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;padding-block:12px}
.btn{flex:1;min-height:56px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:1.1rem;font-weight:600}
.btn.ghost{flex:0 0 auto;padding-inline:20px;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* 完成页 */
.done{text-align:left}
.done .seal{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin-bottom:16px}
.done .seal svg{width:46px;height:46px}
.ticket{margin-top:20px;border:1px dashed var(--accent);border-radius:var(--radius);padding:16px;background:var(--surface);display:grid;gap:8px}
.ticket .row{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.ticket .row span:first-child{color:var(--muted)}
.ticket code{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;letter-spacing:.05em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.red{background:var(--bad-soft);color:var(--bad)}
.pill.yellow{background:var(--warn-soft);color:var(--warn)}
.pill.green{background:var(--good-soft);color:var(--good)}
.promise{margin-top:20px;display:grid;gap:12px}
.promise div{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.promise b{font-family:var(--serif);font-size:1.2rem;color:var(--amber);line-height:1.4}
.note{font-size:.8rem;color:var(--muted);margin-top:14px}

/* 体系说明 / 看板 */
.sec{margin-top:28px}
.sec h2{font-size:1.25rem;margin-bottom:12px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:18px}
.timeline li::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.timeline h3{font-size:1.05rem}
.timeline p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--amber-soft);color:var(--warn);margin-left:6px;vertical-align:2px;font-family:var(--sans);font-weight:600}
.loop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.loop div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.85rem}
.loop div b{display:block;font-family:var(--serif);font-size:1rem;color:var(--accent)}
@media (max-width:420px){.loop{grid-template-columns:1fr 1fr}.loop div:last-child{grid-column:1/-1}}
.sla{width:100%;border-collapse:collapse;font-size:.9rem}
.sla th,.sla td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sla th{color:var(--muted);font-weight:600;font-size:.8rem;letter-spacing:.06em}
.scroll{overflow-x:auto}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:6px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .k{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--serif);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:.78rem;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:9em 1fr 3em;gap:10px;align-items:center;font-size:.88rem}
.barrow .lbl{min-width:0;overflow-wrap:anywhere}
.barrow .track{height:14px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:999px}
.barrow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--line)}
.stack div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tickets{display:grid;gap:8px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;font-size:.9rem}
.tk .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .h code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-top:14px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo{display:inline-block;margin-top:8px;font-size:.8rem;color:var(--warn);background:var(--warn-soft);padding:2px 10px;border-radius:999px}

/* 海报 */
.poster{background:var(--surface);border-radius:20px;border:1px solid var(--line);padding:22px;display:grid;gap:16px}
.poster h1{font-size:1.9rem;line-height:1.25}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrbox{display:grid;gap:8px;justify-items:center;text-align:center}
.qrbox .code{width:100%;max-width:220px;aspect-ratio:1;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line)}
.qrbox .code svg{width:100%;height:100%;display:block}
.qrbox b{font-family:var(--serif);font-size:1.05rem}
.qrbox span{font-size:.82rem;color:var(--muted)}
.url{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.pulse circle{animation:press 2.4s ease-in-out infinite}
@keyframes press{0%,100%{opacity:.35}50%{opacity:1}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="home-link" aria-label="稳步 首页">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M11 4c4 0 6 4 6 9s-2 8-2 12-2 4-4 4-4-1-4-5 1-6 0-10S7 4 11 4z" fill="var(--accent)"/><path d="M23 9c3 0 4 3 4 7s-2 6-2 9-1 3-3 3-3-1-3-4 1-4 0-7-0-8 4-8z" fill="var(--amber)"/></svg>
      <span><b>稳步</b><br><small>新老年步态健康守护计划</small></span>
    </a>
    <button class="tool" id="speak" type="button" hidden aria-label="朗读本题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>朗读
    </button>
    <button class="tool" id="bigger" type="button" aria-pressed="false" aria-label="放大字号">大字</button>
  </div>
</header>

<main id="app" class="wrap"></main>
<nav class="bar" id="bar" hidden><div class="wrap" id="bar-inner"></div></nav>

<script>
/* 极简二维码编码器（字节模式，纠错等级 M/Q），算法参照 Nayuki QR Code generator（MIT） */
(function (root) {
  var ECC_CW = {
    M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    Q: [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
  };
  var NUM_BLK = {
    M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    Q: [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68]
  };
  var FMT = { M: 0, Q: 3 };

  function rawModules(v) {
    var r = (16 * v + 128) * v + 64;
    if (v >= 2) { var n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  function dataCW(v, e) { return Math.floor(rawModules(v) / 8) - ECC_CW[e][v] * NUM_BLK[e][v]; }
  function mul(x, y) { var z = 0; for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; }
  function divisor(d) {
    var r = []; for (var i = 0; i < d - 1; i++) r.push(0); r.push(1);
    var rt = 1;
    for (var i = 0; i < d; i++) {
      for (var j = 0; j < r.length; j++) { r[j] = mul(r[j], rt); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
      rt = mul(rt, 2);
    }
    return r;
  }
  function remainder(data, div) {
    var r = div.map(function () { return 0; });
    data.forEach(function (b) {
      var f = b ^ r.shift(); r.push(0);
      div.forEach(function (c, i) { r[i] ^= mul(c, f); });
    });
    return r;
  }
  function utf8(s) { return Array.from(unescape(encodeURIComponent(s))).map(function (c) { return c.charCodeAt(0); }); }
  function bit(x, i) { return ((x >>> i) & 1) !== 0; }

  function encode(text, ecl) {
    ecl = ecl || 'M';
    var bytes = utf8(text), ver;
    for (ver = 1; ver <= 40; ver++) {
      var cc = ver < 10 ? 8 : 16;
      if (4 + cc + bytes.length * 8 <= dataCW(ver, ecl) * 8) break;
    }
    if (ver > 40) throw new Error('too long');
    var bb = [];
    function app(val, len) { for (var i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); }
    app(4, 4); app(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(function (b) { app(b, 8); });
    var cap = dataCW(ver, ecl) * 8;
    app(0, Math.min(4, cap - bb.length));
    app(0, (8 - bb.length % 8) % 8);
    for (var pad = 0xec; bb.length < cap; pad ^= 0xec ^ 0x11) app(pad, 8);
    var data = [];
    for (var i = 0; i < bb.length; i += 8) { var v = 0; for (var j = 0; j < 8; j++) v = (v << 1) | bb[i + j]; data.push(v); }

    // 分块、纠错、交织
    var nb = NUM_BLK[ecl][ver], el = ECC_CW[ecl][ver], raw = Math.floor(rawModules(ver) / 8);
    var nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(el), blocks = [];
    for (var i = 0, k = 0; i < nb; i++) {
      var dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += dat.length;
      var ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var all = [];
    for (var i = 0; i < blocks[0].length; i++)
      blocks.forEach(function (b, j) { if (i !== shortLen - el || j >= nShort) all.push(b[i]); });
